name: Validate Codestra production server API contract

on:
  pull_request:
    paths:
      - docs/CODESTRA_PRODUCTION_SERVER_API_CONTRACT.md
      - .github/workflows/validate-production-server-api-contract.yml
  push:
    branches: [development, test, staging, production, main]
    paths:
      - docs/CODESTRA_PRODUCTION_SERVER_API_CONTRACT.md
      - .github/workflows/validate-production-server-api-contract.yml

permissions:
  contents: read

concurrency:
  group: grafana-production-api-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate source-only production contract
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('docs/CODESTRA_PRODUCTION_SERVER_API_CONTRACT.md').read_text(encoding='utf-8')
          required = [
              'appolon1908-hue/Codestra-Grafana-', '37.27.128.39',
              'SOURCE_CONTRACT_PREPARED_NOT_DEPLOYED', 'GET` | `/api/health',
              'GET` | `/api/search', 'GET` | `/api/datasources',
              'includes Viewer', 'PKCE S256', 'ANONYMOUS_ACCESS=DISABLED',
              'OSS_VIEWER_DATASOURCE_READ_MODEL=DOCUMENTED',
              'ORGANIZATION_OR_DATASOURCE_ISOLATION=PASS',
              'VIEWER_DATASOURCE_READ_BEHAVIOR=MATCHES_OSS_MODEL',
              'DATASOURCE_SECRET_FIELDS_EXPOSED=0',
              'BUSINESS_USER_ACCESS_ENABLED=NO_UNTIL_ISOLATION_PROVEN',
              'CROSS_ORGANIZATION_DATASOURCE_DISCOVERY_DENIED=PASS',
              'WRONG_BUSINESS_QUERY_DENIED=PASS', 'UNEXPECTED_404=0',
              'SOURCE_RUNTIME_DRIFT=0', 'This source document does not deploy Grafana',
          ]
          missing = [value for value in required if value not in text]
          assert not missing, f'missing production API contract controls: {missing}'
          forbidden = [
              'administrator/operator only',
              'ADMIN_BYPASS_AUTHORIZED=YES',
              'SSH_CONFIGURATION_CHANGES_AUTHORIZED=YES',
              ':latest',
          ]
          present = [value for value in forbidden if value in text]
          assert not present, f'forbidden or misleading production contract claims: {present}'
          print('CODESTRA_GRAFANA_PRODUCTION_API_CONTRACT=PASS')
          PY
