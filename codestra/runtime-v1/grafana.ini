app_mode = production
instance_name = Codestra Corporate Operations

[server]
protocol = http
http_addr = 0.0.0.0
http_port = 3000
domain = graf.codestra.media
enforce_domain = true
root_url = https://graf.codestra.media/
enable_gzip = true
router_logging = false

[database]
type = postgres
host = $__env{GF_DATABASE_HOST}
name = $__env{GF_DATABASE_NAME}
user = $__env{GF_DATABASE_USER}
password = $__file{/run/secrets/grafana_database_password}
ssl_mode = require
max_open_conn = 50
max_idle_conn = 10
conn_max_lifetime = 14400

[security]
admin_user = codestra-breakglass
admin_password = $__file{/run/secrets/grafana_admin_password}
secret_key = $__file{/run/secrets/grafana_secret_key}
disable_gravatar = true
cookie_secure = true
cookie_samesite = strict
content_security_policy = true
strict_transport_security = true
strict_transport_security_max_age_seconds = 31536000
strict_transport_security_preload = true
x_content_type_options = true
x_xss_protection = true

[users]
allow_sign_up = false
allow_org_create = false
auto_assign_org = true
auto_assign_org_role = Viewer
default_theme = light
viewers_can_edit = false
editors_can_admin = false

[auth]
disable_login_form = true
disable_signout_menu = false
oauth_auto_login = true
login_maximum_inactive_lifetime_duration = 8h
login_maximum_lifetime_duration = 24h
token_rotation_interval_minutes = 10

[auth.basic]
enabled = false

[auth.anonymous]
enabled = false

[auth.generic_oauth]
enabled = true
name = Codestra Identity
allow_sign_up = true
client_id = $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_ID}
client_secret = $__file{/run/secrets/grafana_oauth_client_secret}
scopes = openid profile email roles
auth_url = $__env{GF_AUTH_GENERIC_OAUTH_AUTH_URL}
token_url = $__env{GF_AUTH_GENERIC_OAUTH_TOKEN_URL}
api_url = $__env{GF_AUTH_GENERIC_OAUTH_API_URL}
use_pkce = true
use_refresh_token = true
role_attribute_path = contains(realm_access.roles[*], 'grafana-admin') && 'GrafanaAdmin' || contains(realm_access.roles[*], 'grafana-editor') && 'Editor' || contains(realm_access.roles[*], 'grafana-viewer') && 'Viewer'
role_attribute_strict = true
allow_assign_grafana_admin = true
skip_org_role_sync = false

[dashboards]
default_home_dashboard_path = /var/lib/grafana/codestra-home/codestra-corporate-home.json
versions_to_keep = 20
min_refresh_interval = 30s

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[snapshots]
external_enabled = false

[explore]
enabled = true

[feature_toggles]
enable = correlations traceqlEditor

[log]
mode = console
level = info
format = json

[metrics]
enabled = true
interval_seconds = 15
