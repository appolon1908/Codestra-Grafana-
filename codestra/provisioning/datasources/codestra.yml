apiVersion: 1

prune: true

deleteDatasources:
  - name: Codestra Prometheus
    orgId: 1
  - name: Codestra Loki
    orgId: 1
  - name: Codestra Tempo
    orgId: 1
  - name: Codestra Alertmanager
    orgId: 1
  - name: Codestra Middleware Observability
    orgId: 1

datasources:
  - name: Codestra Prometheus
    uid: codestra-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      queryTimeout: 60s
      manageAlerts: false
      tlsSkipVerify: false
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: codestra-tempo
        - name: traceID
          datasourceUid: codestra-tempo

  - name: Codestra Loki
    uid: codestra-loki
    type: loki
    access: proxy
    url: http://loki-query:3100
    editable: false
    jsonData:
      timeout: 60
      maxLines: 1000
      manageAlerts: false
      tlsSkipVerify: false
      derivedFields:
        - name: TraceID
          matcherRegex: 'trace_id[=:]"?([A-Fa-f0-9]{16,32})'
          datasourceUid: codestra-tempo
          url: '$${__value.raw}'
        - name: CorrelationID
          matcherRegex: 'correlation_id[=:]"?([A-Za-z0-9._:-]+)'
          url: '/explore?left=$${__value.raw}'

  - name: Codestra Tempo
    uid: codestra-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      timeout: 60
      tlsSkipVerify: false
      nodeGraph:
        enabled: true
      serviceMap:
        datasourceUid: codestra-prometheus
      tracesToLogsV2:
        datasourceUid: codestra-loki
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        filterByTraceID: true
        filterBySpanID: true
        customQuery: false
        tags:
          - key: service.name
            value: service
          - key: deployment.environment.name
            value: environment
          - key: codestra.business
            value: codestra_business
      tracesToMetrics:
        datasourceUid: codestra-prometheus
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        tags:
          - key: service.name
            value: service
          - key: deployment.environment.name
            value: environment
          - key: codestra.business
            value: codestra_business
        queries:
          - name: Request rate
            query: 'sum(rate(codestra_http_requests_total{$$__tags}[5m]))'
          - name: Error ratio
            query: 'sum(rate(codestra_http_requests_total{$$__tags,status=~"5.."}[5m])) / clamp_min(sum(rate(codestra_http_requests_total{$$__tags}[5m])), 0.001)'
          - name: p95 latency
            query: 'histogram_quantile(0.95, sum by (le) (rate(codestra_http_request_duration_seconds_bucket{$$__tags}[5m])))'

  - name: Codestra Alertmanager
    uid: codestra-alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    editable: false
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false
      tlsSkipVerify: false

  # Middleware is the operational control plane: incidents, service catalog and
  # monitoring state are read here through its private runtime. The bearer is
  # the grafana-runtime OpenBao reference rendered to a file; it is never in
  # source, never returned to a browser, and the datasource can reach nothing
  # but the Middleware runtime.
  - name: Codestra Middleware Observability
    uid: codestra-middleware-observability
    type: yesoreyeram-infinity-datasource
    access: proxy
    url: http://middleware-integration-api:8095
    editable: false
    jsonData:
      auth_method: bearerToken
      allowedHosts:
        - http://middleware-integration-api:8095
      oauthPassThru: false
      tlsSkipVerify: false
      timeoutInSeconds: 10
    secureJsonData:
      bearerToken: $__file{/run/secrets/grafana_middleware_observability_token}
