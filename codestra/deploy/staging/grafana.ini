app_mode = production
instance_name = Codestra Staging Observability

[server]
protocol = http
http_addr = 0.0.0.0
http_port = 3000
domain = graf.codestra.media
enforce_domain = true
root_url = https://graf.codestra.media/
enable_gzip = true
router_logging = false

[database]
type = sqlite3
path = /var/lib/grafana/grafana.db
wal = true
query_retries = 3
transaction_retries = 5

[security]
disable_initial_admin_creation = false
cookie_secure = true
cookie_samesite = strict
allow_embedding = false
disable_gravatar = true
data_source_proxy_whitelist = prometheus-staging:9090
content_type_protection = true
strict_transport_security = true

[users]
allow_sign_up = false
allow_org_create = false
auto_assign_org = true
auto_assign_org_role = Viewer
viewers_can_edit = false
default_theme = dark

[auth]
disable_login_form = false
disable_signout_menu = false

[auth.basic]
enabled = true

[auth.anonymous]
enabled = false

[snapshots]
enabled = false
external_enabled = false

[public_dashboards]
enabled = false

[dashboards]
versions_to_keep = 5
min_refresh_interval = 15s
default_home_dashboard_path = /etc/grafana/dashboards/middleware-safety-observability.json

[explore]
enabled = true

[unified_alerting]
enabled = false

[alerting]
enabled = false

[smtp]
enabled = false

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[plugins]
plugin_admin_enabled = false
plugin_admin_external_manage_enabled = false
preinstall_disabled = true
plugin_catalog_url =
public_key_retrieval_disabled = true

[news]
news_feed_enabled = false

[log]
mode = console
level = info
format = json
